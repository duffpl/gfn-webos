# Tests on every push to main and every pull request; a vX.Y.Z tag also builds the .ipk and
# attaches it to a draft release. Everything runs in the toolchain image from docker/Dockerfile,
# tagged by that file's hash so it is rebuilt only when the file changes.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gfn-webos-build:$(sha256sum docker/Dockerfile | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image unless it exists
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE is already published"
            exit 0
          fi
          docker build --platform linux/amd64 -t "$IMAGE" docker
          docker push "$IMAGE"

  test:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: test-${{ hashFiles('docker/Dockerfile', 'Cargo.lock') }}
          restore-keys: test-${{ hashFiles('docker/Dockerfile') }}-
      - run: cargo test --workspace --features gfn-app/sim
      - run: cargo test --manifest-path vendor/OpenNOW/native/opennow-core/Cargo.toml --target-dir target/opennow-core-host

  ipk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, test]
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: ipk-${{ hashFiles('docker/Dockerfile', 'Cargo.lock') }}
          restore-keys: ipk-${{ hashFiles('docker/Dockerfile') }}-
      # The package version comes from appinfo.json; webOS wants exactly three numbers.
      - name: Take the version from the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2
            exit 1
          fi
          python3 - "$version" <<'EOF'
          import json, sys
          path = "pkg/appinfo.json"
          info = json.load(open(path))
          info["version"] = sys.argv[1]
          with open(path, "w") as f:
              json.dump(info, f, indent=2)
              f.write("\n")
          EOF
      - run: scripts/build-ipk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: build/*.ipk
          if-no-files-found: error

  release:
    needs: ipk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ipk
      # A draft: nothing is public until it is published by hand.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes ./*.ipk
